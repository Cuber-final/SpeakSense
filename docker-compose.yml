version: '3.9'
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env.example
    environment:
      - APP_ENV=dev
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=postgresql+psycopg://user:pass@db:5432/speakcoach
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - backend/.env.example
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg://user:pass@db:5432/speakcoach
    depends_on:
      - redis
      - db
    command: ["bash", "-lc", "rq worker -u $$REDIS_URL default"]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rq-dashboard:
    image: eoranged/rq-dashboard:latest
    environment:
      - RQ_DASHBOARD_REDIS_URL=redis://redis:6379/0
    ports:
      - "9181:9181"
    depends_on:
      - redis

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=speakcoach
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

